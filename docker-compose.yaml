services:
  postgres:
    image: postgres:15
    container_name: wedding-planner-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: foobar
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: