name: Deploy

on:
  push:
    branches:
      - main
      - staging
      - production

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  migrations:
    name: Run migrations
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref_name == 'staging' || github.ref_name == 'production'
    environment: ${{ github.ref_name == 'staging' && 'motivated-patience / staging' || github.ref_name == 'production' && 'motivated-patience / production' || '' }}
    env:
      DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate
