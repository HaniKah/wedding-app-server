name: test & migrate

on:
  push:
    branches:
      - live
      - staging
      - main
jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout node
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Checks
        run: npx tsc --noEmit

      - name: Running Tests
        run: npm run test

      - name: Run migrations
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/live'
        run: npm run migrate
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}